<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lợi ích của Công Nghệ Số Trong Học Tập</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#6ea2cf;
            display:flex;
            justify-content:center;
            padding:30px 0;
        }

        .container{
            width:800px;
        }

        h1{
            text-align:center;
            color:#d8ff2b;
            font-size:48px;
            font-weight:900;
            margin-bottom:40px;
            text-transform:uppercase;
        }

        .item{
            display:flex;
            align-items:center;
            margin:25px 0;
            background:#dff0d8;
            border-radius:20px;
            overflow:hidden;
            min-height:160px;
        }

        .item:nth-child(3){
            background:#e8f1ff;
        }

        .item:nth-child(4){
            background:#e7ff76;
        }

        .item:nth-child(5){
            background:#dff0d8;
        }

        .item:nth-child(6){
            background:#e8f1ff;
        }

        .icon{
            width:220px;
            height:160px;
            background:rgba(255,255,255,0.5);
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:70px;
        }

        .content{
            flex:1;
            padding:20px 30px;
        }

        .content h2{
            font-size:42px;
            color:#000;
            line-height:1.1;
        }

        footer{
            text-align:center;
            margin-top:40px;
            font-size:32px;
            font-family:"Times New Roman", serif;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Lợi Ích Của Công Nghệ Số Trong Học Tập</h1>

        <div class="item">
            <div class="icon">📚</div>
            <div class="content">
                <h2>Tiếp cận tài nguyên đa dạng</h2>
            </div>
        </div>

        <div class="item">
            <div class="icon">📱</div>
            <div class="content">
                <h2>Tương tác linh hoạt, học cá nhân hóa</h2>
            </div>
        </div>

        <div class="item">
            <div class="icon">⚙️</div>
            <div class="content">
                <h2>Phát triển kỹ năng số</h2>
            </div>
        </div>

        <div class="item">
            <div class="icon">🌐</div>
            <div class="content">
                <h2>Học tập mọi lúc mọi nơi</h2>
            </div>
        </div>

        <div class="item">
            <div class="icon">🧠</div>
            <div class="content">
                <h2>Tăng cường hiệu quả ghi nhớ</h2>
            </div>
        </div>

        <footer>
            (Infographic tạo bởi Canva AI).
        </footer>

    </div>
</body>
</html>
